plugins {
    id 'com.android.application'
}

android {
    namespace 'com.androidcleaner.redmi'
    compileSdk 35

    defaultConfig {
        applicationId 'com.androidcleaner.redmi'
        minSdk 26
        targetSdk 32
        versionCode 2
        versionName '2.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}